<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost — Guardian Lookup</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #060810;
      --surface: #0c1120;
      --surface2: #111827;
      --border: #1e2d45;
      --accent: #c8a84b;
      --accent2: #4b8fc8;
      --ghost: #a8d4ff;
      --text: #d0dff0;
      --muted: #5a7090;
      --danger: #c84b4b;
      --success: #4bc88a;
      --titan: #4b8fc8;
      --hunter: #c8a84b;
      --warlock: #8a4bc8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated starfield */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(168, 212, 255, 0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 10%, rgba(168, 212, 255, 0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 50% 60%, rgba(168, 212, 255, 0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 80%, rgba(200, 168, 75, 0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 70%, rgba(168, 212, 255, 0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 15%, rgba(168, 212, 255, 0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 85%, rgba(168, 212, 255, 0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 45%, rgba(200, 168, 75, 0.2) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 60% 20%, rgba(75, 143, 200, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 20% 80%, rgba(200, 168, 75, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* Header */
    header {
      padding: 40px 0 30px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
    }

    .ghost-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ghost);
      line-height: 1;
    }

    .header-text p {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    /* API Key section */
    .api-section {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px 24px;
      margin-bottom: 28px;
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
      position: relative;
    }

    .api-section::before {
      content: 'API KEY';
      position: absolute;
      top: 8px;
      right: 28px;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
    }

    .api-section label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .api-input-row {
      display: flex;
      gap: 10px;
    }

    /* Inputs */
    input[type="text"],
    input[type="password"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent2);
    }

    input::placeholder {
      color: var(--muted);
    }

    /* Buttons */
    button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 10px 20px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }

    button:hover {
      background: var(--accent);
      color: var(--bg);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.secondary {
      border-color: var(--border);
      color: var(--muted);
    }

    button.secondary:hover {
      border-color: var(--accent2);
      color: var(--accent2);
      background: transparent;
    }

    /* Search */
    .search-section {
      margin-bottom: 28px;
    }

    .search-label {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      font-family: 'Share Tech Mono', monospace;
    }

    /* Status / error */
    .status-bar {
      padding: 10px 16px;
      font-size: 12px;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .status-bar.error {
      display: flex;
      border-left: 3px solid var(--danger);
      background: rgba(200, 75, 75, 0.08);
      color: #ff8a8a;
    }

    .status-bar.info {
      display: flex;
      border-left: 3px solid var(--accent2);
      background: rgba(75, 143, 200, 0.08);
      color: var(--ghost);
    }

    /* Loading spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Search results list */
    .results-list {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .result-item {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item:hover {
      background: rgba(75, 143, 200, 0.08);
    }

    .result-name {
      font-weight: 600;
      font-size: 15px;
      color: var(--ghost);
    }

    .result-code {
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
    }

    .result-platform {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 2px 8px;
    }

    /* Guardian profile card */
    #profile-section {
      display: none;
    }

    .profile-header {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 20px;
      clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 0 100%);
      position: relative;
      overflow: hidden;
    }

    .profile-header::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 80px;
      height: 80px;
      background: linear-gradient(225deg, rgba(75, 143, 200, 0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .guardian-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ghost);
      margin-bottom: 4px;
    }

    .guardian-code {
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
    }

    /* Character tabs */
    .char-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .char-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 18px;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      min-width: 140px;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    }

    .char-tab:hover {
      border-color: var(--accent2);
    }

    .char-tab.active {
      border-color: var(--accent);
      background: rgba(200, 168, 75, 0.08);
    }

    .char-class {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .char-class.titan {
      color: var(--titan);
    }

    .char-class.hunter {
      color: var(--hunter);
    }

    .char-class.warlock {
      color: var(--warlock);
    }

    .char-light {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .char-light::before {
      content: '◆';
      font-size: 10px;
    }

    .char-race {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Activity filters */
    .activity-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .mode-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      letter-spacing: 0.05em;
      outline: none;
      cursor: pointer;
      flex: 1;
      min-width: 160px;
    }

    .section-title {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Activity list */
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .activity-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px;
      align-items: center;
      transition: border-color 0.15s, background 0.15s;
      animation: fadeIn 0.3s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .activity-item:hover {
      background: var(--surface2);
    }

    .activity-item.win {
      border-left-color: var(--success);
    }

    .activity-item.loss {
      border-left-color: var(--danger);
    }

    .activity-item.completed {
      border-left-color: var(--accent2);
    }

    .act-main {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .act-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.03em;
    }

    .act-meta {
      font-size: 11px;
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .act-stats {
      display: flex;
      gap: 16px;
      align-items: center;
      text-align: right;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--ghost);
      font-family: 'Share Tech Mono', monospace;
    }

    .stat-lbl {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .act-result {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 2px 8px;
      border: 1px solid;
    }

    .act-result.win {
      color: var(--success);
      border-color: var(--success);
      background: rgba(75, 200, 138, 0.08);
    }

    .act-result.loss {
      color: var(--danger);
      border-color: var(--danger);
      background: rgba(200, 75, 75, 0.08);
    }

    .act-result.completed {
      color: var(--accent2);
      border-color: var(--accent2);
      background: rgba(75, 143, 200, 0.08);
    }

    /* Pagination */
    .pagination {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }

    .page-info {
      font-size: 12px;
      font-family: 'Share Tech Mono', monospace;
      color: var(--muted);
      display: flex;
      align-items: center;
      padding: 0 12px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 14px;
      letter-spacing: 0.08em;
    }

    /* Divider decoration */
    .deco-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 8px 0 20px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .act-stats {
        gap: 10px;
      }

      .char-tabs {
        flex-direction: column;
      }

      .act-meta {
        gap: 6px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <svg class="ghost-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="20,4 34,12 34,28 20,36 6,28 6,12" fill="none" stroke="#a8d4ff" stroke-width="1.5" />
        <polygon points="20,10 28,15 28,25 20,30 12,25 12,15" fill="rgba(168,212,255,0.08)" stroke="#4b8fc8"
          stroke-width="1" />
        <circle cx="20" cy="20" r="4" fill="#a8d4ff" opacity="0.9" />
        <circle cx="20" cy="20" r="2" fill="#ffffff" />
      </svg>
      <div class="header-text">
        <h1>Ghost</h1>
        <p>Destiny 2 · Guardian Lookup</p>
      </div>
    </header>

    <!-- API Key -->
    <div class="api-section">
      <label>Bungie API Key</label>
      <div class="api-input-row">
        <input type="password" id="apiKey" placeholder="Paste your API key from bungie.net/en/Application" />
        <button onclick="saveKey()">Set Key</button>
      </div>
    </div>

    <!-- Search -->
    <div class="search-section">
      <label class="search-label">Search Guardian</label>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="BungieName#1234"
          onkeydown="if(event.key==='Enter') search()" />
        <button id="searchBtn" onclick="search()">Search</button>
      </div>
      <div class="search-hint">Enter the guardian's Bungie name with their numeric code</div>
    </div>

    <!-- Status -->
    <div class="status-bar" id="statusBar">
      <div class="spinner" id="statusSpinner" style="display:none"></div>
      <span id="statusText"></span>
    </div>

    <!-- Search results -->
    <div class="results-list" id="resultsList"></div>

    <!-- Guardian profile -->
    <div id="profile-section">
      <div class="profile-header">
        <div class="guardian-name" id="guardianName"></div>
        <div class="guardian-code" id="guardianCode"></div>
      </div>

      <div class="section-title">Characters</div>
      <div class="char-tabs" id="charTabs"></div>

      <div class="deco-line"></div>

      <div class="activity-controls">
        <select class="mode-select" id="modeFilter" onchange="loadActivities(0)">
          <option value="0">All Activities</option>
          <option value="7">PvE</option>
          <option value="4">Raids</option>
          <option value="82">Dungeons</option>
          <option value="3">Strikes</option>
          <option value="18">Nightfalls</option>
          <option value="5">PvP</option>
          <option value="84">Trials of Osiris</option>
          <option value="19">Iron Banner</option>
          <option value="63">Gambit</option>
          <option value="6">Patrol</option>
        </select>
        <button class="secondary" onclick="loadActivities(0)">↺ Refresh</button>
      </div>

      <div class="section-title">Activity History</div>
      <div class="activity-list" id="activityList">
        <div class="empty-state">
          <div class="icon">◈</div>
          <p>Select a character to view activities</p>
        </div>
      </div>

      <div class="pagination" id="pagination" style="display:none">
        <button class="secondary" id="prevBtn" onclick="changePage(-1)">◀ Prev</button>
        <div class="page-info" id="pageInfo"></div>
        <button class="secondary" id="nextBtn" onclick="changePage(1)">Next ▶</button>
      </div>
    </div>

  </div>

  <script>
    const API_ROOT = 'https://www.bungie.net/Platform';
    const BUNGIE_ROOT = 'https://www.bungie.net';

    // State
    let state = {
      apiKey: '',
      membershipId: '',
      membershipType: '',
      displayName: '',
      displayNameCode: '',
      characters: [],
      activeCharId: '',
      currentPage: 0,
      loading: false
    };

    // Class / race maps
    const CLASS_NAMES = { 0: 'Titan', 1: 'Hunter', 2: 'Warlock', 3: 'Unknown' };
    const RACE_NAMES = { 0: 'Human', 1: 'Awoken', 2: 'Exo', 3: 'Unknown' };
    const PLATFORM_NAMES = { 1: 'Xbox', 2: 'PSN', 3: 'Steam', 4: 'Blizzard', 5: 'Stadia', 6: 'Epic', 10: 'Demon', 254: 'BungieNet', 0: 'None' };
    const MODE_NAMES = {
      0: 'All', 2: 'Story', 3: 'Strike', 4: 'Raid', 5: 'PvP', 6: 'Patrol',
      7: 'PvE', 9: '', 10: 'Control', 12: 'Clash', 15: 'Crimson Doubles',
      16: 'Nightfall', 17: 'Heroic Nightfall', 18: 'All Strikes', 19: 'Iron Banner',
      25: 'Mayhem', 31: 'Supremacy', 37: 'Survival', 38: 'Countdown',
      39: 'Trials of the Nine', 43: 'IB Control', 44: 'IB Clash', 45: 'IB Supremacy',
      46: 'Scored Nightfall', 47: 'Scored Heroic Nightfall', 48: 'Rumble',
      58: 'Heroic Adventure', 59: 'Showdown', 61: 'Scorched', 62: 'Scorched Team',
      63: 'Gambit', 64: 'PvE Competitive', 65: 'Breakthrough',
      69: 'PvP Competitive', 70: 'PvP Quickplay', 75: 'Gambit Prime',
      76: 'Reckoning', 77: 'Menagerie', 78: 'Vex Offensive', 79: 'Nightmare Hunt',
      80: 'Elimination', 81: 'Momentum', 82: 'Dungeon', 83: 'Sundial',
      84: 'Trials of Osiris', 85: 'Dares of Eternity', 86: 'Offensive',
      87: 'Lost Sector', 88: 'Rift', 89: 'Zone Control', 90: 'IB Rift', 91: 'IB Zone Control'
    };

    // Init saved key
    window.onload = () => {
      const saved = localStorage.getItem('bungie_api_key');
      if (saved) {
        document.getElementById('apiKey').value = saved;
        state.apiKey = saved;
        showStatus('API key loaded. Enter a guardian name to search.', 'info', false);
      }
    };

    function saveKey() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) return showStatus('Please enter an API key.', 'error', false);
      state.apiKey = key;
      localStorage.setItem('bungie_api_key', key);
      showStatus('API key saved.', 'info', false);
    }

    function showStatus(msg, type = 'info', loading = false) {
      const bar = document.getElementById('statusBar');
      bar.className = 'status-bar ' + type;
      document.getElementById('statusText').textContent = msg;
      document.getElementById('statusSpinner').style.display = loading ? 'block' : 'none';
      bar.style.display = 'flex';
    }

    function hideStatus() {
      document.getElementById('statusBar').style.display = 'none';
    }

    function api(path) {
      if (!state.apiKey) { showStatus('Set your API key first.', 'error', false); throw new Error('No API key'); }
      return fetch(API_ROOT + path, { headers: { 'X-API-Key': state.apiKey } }).then(r => r.json());
    }

    function apiPost(path, body) {
      if (!state.apiKey) { showStatus('Set your API key first.', 'error', false); throw new Error('No API key'); }
      return fetch(API_ROOT + path, {
        method: 'POST',
        headers: { 'X-API-Key': state.apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(r => r.json());
    }

    async function search() {
      const raw = document.getElementById('searchInput').value.trim();
      if (!raw) return;
      if (!state.apiKey) { showStatus('Set your API key first.', 'error', false); return; }

      // Parse name#code
      let displayName = raw, displayNameCode = 0;
      const hashIdx = raw.lastIndexOf('#');
      if (hashIdx > 0) {
        displayName = raw.slice(0, hashIdx);
        displayNameCode = parseInt(raw.slice(hashIdx + 1)) || 0;
      }

      document.getElementById('resultsList').style.display = 'none';
      document.getElementById('profile-section').style.display = 'none';
      showStatus('Searching for guardian...', 'info', true);

      try {
        // Search across all platforms (-1)
        const data = await apiPost('/Destiny2/SearchDestinyPlayerByBungieName/-1/', {
          displayName, displayNameCode
        });

        if (data.ErrorCode !== 1) {
          showStatus('Error: ' + (data.Message || 'API error'), 'error', false);
          return;
        }

        const results = data.Response || [];
        if (results.length === 0) {
          showStatus('No guardians found. Check the name and code.', 'error', false);
          return;
        }

        hideStatus();

        if (results.length === 1) {
          await loadProfile(results[0]);
        } else {
          renderResultsList(results);
        }
      } catch (e) {
        showStatus('Request failed. Check your API key and network.', 'error', false);
      }
    }

    function renderResultsList(results) {
      const list = document.getElementById('resultsList');
      list.innerHTML = '';

      results.forEach(r => {
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
      <div>
        <div class="result-name">${r.bungieGlobalDisplayName}<span class="result-code">#${String(r.bungieGlobalDisplayNameCode).padStart(4, '0')}</span></div>
      </div>
      <div class="result-platform">${PLATFORM_NAMES[r.membershipType] || 'Platform ' + r.membershipType}</div>
    `;
        item.onclick = () => loadProfile(r);
        list.appendChild(item);
      });

      list.style.display = 'block';
    }

    async function loadProfile(player) {
      document.getElementById('resultsList').style.display = 'none';
      showStatus('Loading guardian profile...', 'info', true);

      state.membershipId = player.membershipId;
      state.membershipType = player.membershipType;
      state.displayName = player.bungieGlobalDisplayName || player.displayName;
      state.displayNameCode = player.bungieGlobalDisplayNameCode;

      try {
        const data = await api(`/Destiny2/${state.membershipType}/Profile/${state.membershipId}/?components=100,200`);

        if (data.ErrorCode !== 1) {
          showStatus('Error loading profile: ' + (data.Message || 'unknown'), 'error', false);
          return;
        }

        const chars = data.Response.characters?.data;
        if (!chars) { showStatus('No characters found on this account.', 'error', false); return; }

        state.characters = Object.values(chars).sort((a, b) => new Date(b.dateLastPlayed) - new Date(a.dateLastPlayed));

        // Render
        document.getElementById('guardianName').textContent = state.displayName;
        document.getElementById('guardianCode').textContent =
          '#' + String(state.displayNameCode).padStart(4, '0') +
          ' · ' + (PLATFORM_NAMES[state.membershipType] || '');

        renderCharTabs();
        document.getElementById('profile-section').style.display = 'block';
        hideStatus();

        if (state.characters.length > 0) {
          selectChar(state.characters[0].characterId);
        }
      } catch (e) {
        showStatus('Failed to load profile.', 'error', false);
      }
    }

    function renderCharTabs() {
      const tabs = document.getElementById('charTabs');
      tabs.innerHTML = '';
      state.characters.forEach(c => {
        const cls = CLASS_NAMES[c.classType] || 'Unknown';
        const race = RACE_NAMES[c.raceType] || '';
        const tab = document.createElement('div');
        tab.className = 'char-tab';
        tab.dataset.charid = c.characterId;
        tab.innerHTML = `
      <div class="char-class ${cls.toLowerCase()}">${cls}</div>
      <div class="char-light">${c.light}</div>
      <div class="char-race">${race}</div>
    `;
        tab.onclick = () => selectChar(c.characterId);
        tabs.appendChild(tab);
      });
    }

    function selectChar(charId) {
      state.activeCharId = charId;
      state.currentPage = 0;
      document.querySelectorAll('.char-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.charid === charId);
      });
      loadActivities(0);
    }

    async function loadActivities(page) {
      if (!state.activeCharId) return;
      state.currentPage = page;
      const mode = document.getElementById('modeFilter').value;

      showStatus('Loading activities...', 'info', true);
      document.getElementById('activityList').innerHTML = '<div class="empty-state"><div class="spinner" style="margin:0 auto 16px;width:24px;height:24px;border-width:2px"></div><p>Retrieving activity history...</p></div>';
      document.getElementById('pagination').style.display = 'none';

      try {
        const data = await api(
          `/Destiny2/${state.membershipType}/Account/${state.membershipId}/Character/${state.activeCharId}/Stats/Activities/` +
          `?count=15&mode=${mode}&page=${page}`
        );

        hideStatus();

        if (data.ErrorCode !== 1) {
          showStatus('Error: ' + (data.Message || 'Failed to load activities'), 'error', false);
          document.getElementById('activityList').innerHTML = '<div class="empty-state"><div class="icon">◈</div><p>Could not load activities</p></div>';
          return;
        }

        const activities = data.Response?.activities || [];
        renderActivities(activities);
      } catch (e) {
        hideStatus();
        showStatus('Failed to load activities.', 'error', false);
      }
    }

    function renderActivities(activities) {
      const list = document.getElementById('activityList');

      if (activities.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">◈</div><p>No activities found for this filter</p></div>';
        document.getElementById('pagination').style.display = 'none';
        return;
      }

      list.innerHTML = '';

      activities.forEach((act, i) => {
        const v = act.values || {};
        const details = act.activityDetails || {};
        const mode = details.mode || 0;
        const modeName = MODE_NAMES[mode] || ('Mode ' + mode);
        const period = new Date(act.period);
        const dateStr = period.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        const timeStr = period.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

        const kills = Math.round(v.kills?.basic?.value || 0);
        const deaths = Math.round(v.deaths?.basic?.value || 0);
        const assists = Math.round(v.assists?.basic?.value || 0);
        const kd = deaths > 0 ? (kills / deaths).toFixed(2) : kills > 0 ? '∞' : '0.00';
        const duration = formatDuration(v.activityDurationSeconds?.basic?.value || 0);

        // Result
        const standing = v.standing?.basic?.value; // 0 = victory, 1 = defeat
        const completed = v.completed?.basic?.value;
        let resultClass = 'completed', resultLabel = 'Completed';
        if (standing === 0) { resultClass = 'win'; resultLabel = 'Victory'; }
        else if (standing === 1) { resultClass = 'loss'; resultLabel = 'Defeat'; }
        else if (completed === 0) { resultClass = 'loss'; resultLabel = 'DNF'; }

        const item = document.createElement('div');
        item.className = `activity-item ${resultClass}`;
        item.style.animationDelay = (i * 0.03) + 's';
        item.innerHTML = `
      <div class="act-main">
        <div class="act-name">${modeName}</div>
        <div class="act-meta">
          <span>${dateStr} · ${timeStr}</span>
          <span>⏱ ${duration}</span>
        </div>
      </div>
      <div class="act-stats">
        <div class="stat-item">
          <div class="stat-val">${kills}</div>
          <div class="stat-lbl">Kills</div>
        </div>
        <div class="stat-item">
          <div class="stat-val">${deaths}</div>
          <div class="stat-lbl">Deaths</div>
        </div>
        <div class="stat-item">
          <div class="stat-val">${kd}</div>
          <div class="stat-lbl">K/D</div>
        </div>
        <div class="act-result ${resultClass}">${resultLabel}</div>
      </div>
    `;
        list.appendChild(item);
      });

      // Pagination
      const pag = document.getElementById('pagination');
      pag.style.display = 'flex';
      document.getElementById('pageInfo').textContent = 'Page ' + (state.currentPage + 1);
      document.getElementById('prevBtn').disabled = state.currentPage === 0;
      document.getElementById('nextBtn').disabled = activities.length < 15;
    }

    function changePage(dir) {
      const next = state.currentPage + dir;
      if (next < 0) return;
      loadActivities(next);
      window.scrollTo({ top: document.getElementById('activityList').offsetTop - 20, behavior: 'smooth' });
    }

    function formatDuration(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      if (m >= 60) {
        const h = Math.floor(m / 60);
        return `${h}h ${m % 60}m`;
      }
      return `${m}m ${String(s).padStart(2, '0')}s`;
    }
  </script>
</body>

</html>
