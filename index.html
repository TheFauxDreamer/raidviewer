<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost — Guardian Lookup</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #060810;
      --surface: #0c1120;
      --surface2: #111827;
      --border: #1e2d45;
      --accent: #c8a84b;
      --accent2: #4b8fc8;
      --ghost: #a8d4ff;
      --text: #d0dff0;
      --muted: #5a7090;
      --danger: #c84b4b;
      --success: #4bc88a;
      --titan: #4b8fc8;
      --hunter: #c8a84b;
      --warlock: #8a4bc8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(168, 212, 255, 0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 10%, rgba(168, 212, 255, 0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 50% 60%, rgba(168, 212, 255, 0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 80%, rgba(200, 168, 75, 0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 70%, rgba(168, 212, 255, 0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 15%, rgba(168, 212, 255, 0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 85%, rgba(168, 212, 255, 0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 45%, rgba(200, 168, 75, 0.2) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 60% 20%, rgba(75, 143, 200, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 20% 80%, rgba(200, 168, 75, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    header {
      padding: 40px 0 30px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
    }

    .ghost-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ghost);
      line-height: 1;
    }

    .header-text p {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    input[type="text"],
    input[type="password"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent2);
    }

    input::placeholder {
      color: var(--muted);
    }

    button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 10px 20px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }

    button:hover {
      background: var(--accent);
      color: var(--bg);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.secondary {
      border-color: var(--border);
      color: var(--muted);
    }

    button.secondary:hover {
      border-color: var(--accent2);
      color: var(--accent2);
      background: transparent;
    }

    .search-section {
      margin-bottom: 28px;
    }

    .search-label {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      font-family: 'Share Tech Mono', monospace;
    }

    .status-bar {
      padding: 10px 16px;
      font-size: 12px;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .status-bar.error {
      display: flex;
      border-left: 3px solid var(--danger);
      background: rgba(200, 75, 75, 0.08);
      color: #ff8a8a;
    }

    .status-bar.info {
      display: flex;
      border-left: 3px solid var(--accent2);
      background: rgba(75, 143, 200, 0.08);
      color: var(--ghost);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .results-list {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .result-item {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item:hover {
      background: rgba(75, 143, 200, 0.08);
    }

    .result-name {
      font-weight: 600;
      font-size: 15px;
      color: var(--ghost);
    }

    .result-platforms {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    .result-code {
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
    }

    .result-platform {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 2px 8px;
      flex-shrink: 0;
    }

    .result-emblem {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      background: var(--border);
      overflow: hidden;
      position: relative;
    }

    .result-emblem img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .result-emblem img.loaded {
      opacity: 1;
    }

    .result-emblem-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--muted);
      opacity: 0.4;
    }

    #profile-section {
      display: none;
    }

    .profile-header {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 20px;
      clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 0 100%);
      position: relative;
      overflow: hidden;
    }

    .profile-header::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 80px;
      height: 80px;
      background: linear-gradient(225deg, rgba(75, 143, 200, 0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .guardian-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ghost);
      margin-bottom: 4px;
    }

    .guardian-code {
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
    }

    .char-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .char-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 18px;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      min-width: 140px;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    }

    .char-tab:hover {
      border-color: var(--accent2);
    }

    .char-tab.active {
      border-color: var(--accent);
      background: rgba(200, 168, 75, 0.08);
    }

    .char-class {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .char-class.titan {
      color: var(--titan);
    }

    .char-class.hunter {
      color: var(--hunter);
    }

    .char-class.warlock {
      color: var(--warlock);
    }

    .char-light {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .char-light::before {
      content: '◆';
      font-size: 10px;
    }

    .char-race {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    .section-title {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .section-title .count {
      color: var(--accent);
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      font-weight: normal;
      letter-spacing: 0.05em;
    }

    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ── Standard activity card ── */
    .activity-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px;
      align-items: center;
      transition: background 0.15s;
      animation: fadeIn 0.25s ease both;
      position: relative;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .activity-item:hover {
      background: var(--surface2);
    }

    .activity-item.completed {
      border-left-color: var(--accent2);
    }

    .activity-item.dnf {
      border-left-color: var(--danger);
    }

    /* ── First clear — special treatment ── */
    .activity-item.first-clear {
      border: 1px solid rgba(200, 168, 75, 0.35);
      border-left: 4px solid var(--accent);
      background: linear-gradient(90deg, rgba(200, 168, 75, 0.07) 0%, rgba(200, 168, 75, 0.02) 60%, transparent 100%);
      box-shadow: 0 0 20px rgba(200, 168, 75, 0.06), inset 0 0 40px rgba(200, 168, 75, 0.03);
    }

    .activity-item.first-clear:hover {
      background: linear-gradient(90deg, rgba(200, 168, 75, 0.11) 0%, rgba(200, 168, 75, 0.04) 60%, transparent 100%);
    }

    .activity-item.first-clear .act-name {
      color: var(--accent);
    }

    /* shimmer line on first-clear card */
    .activity-item.first-clear::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent);
      opacity: 0.5;
    }

    .act-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .act-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .act-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.03em;
    }

    .first-clear-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(200, 168, 75, 0.5);
      background: rgba(200, 168, 75, 0.1);
      padding: 2px 7px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .first-clear-badge::before {
      content: '◆';
      font-size: 7px;
    }

    .act-type-badge {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 2px 7px;
    }

    .act-type-badge.raid {
      color: #c88aff;
      border-color: rgba(138, 75, 200, 0.4);
      background: rgba(138, 75, 200, 0.06);
    }

    .act-type-badge.dungeon {
      color: var(--accent2);
      border-color: rgba(75, 143, 200, 0.4);
      background: rgba(75, 143, 200, 0.06);
    }

    .act-meta {
      font-size: 11px;
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .act-stats {
      display: flex;
      gap: 16px;
      align-items: center;
      text-align: right;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--ghost);
      font-family: 'Share Tech Mono', monospace;
    }

    .stat-lbl {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .act-result {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 2px 8px;
      border: 1px solid;
    }

    .act-result.ok {
      color: var(--accent2);
      border-color: var(--accent2);
      background: rgba(75, 143, 200, 0.08);
    }

    .act-result.dnf {
      color: var(--danger);
      border-color: var(--danger);
      background: rgba(200, 75, 75, 0.08);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 14px;
      letter-spacing: 0.08em;
    }

    .deco-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 8px 0 20px;
    }

    .summary-bar {
      display: flex;
      gap: 24px;
      padding: 12px 0;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .summary-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .summary-val {
      font-size: 20px;
      font-weight: 700;
      color: var(--ghost);
      font-family: 'Share Tech Mono', monospace;
    }

    .summary-lbl {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .act-stats {
        gap: 10px;
      }

      .char-tabs {
        flex-direction: column;
      }

      .act-meta {
        gap: 6px;
      }

      .act-stats .stat-item:nth-child(3) {
        display: none;
      }
    }

    /* ── Solo filter toggle ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filter-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s;
    }

    .filter-toggle:hover { color: var(--text); }

    .toggle-track {
      width: 32px;
      height: 18px;
      background: var(--border);
      border-radius: 9px;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .toggle-track.on { background: var(--accent2); }

    .toggle-thumb {
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: left 0.2s;
    }

    .toggle-track.on .toggle-thumb { left: 17px; }

    /* ── Expandable fireteam panel ── */
    .activity-item {
      cursor: pointer;
    }

    .activity-item.expanded {
      background: var(--surface2);
    }

    .activity-expand-icon {
      font-size: 10px;
      color: var(--muted);
      margin-left: auto;
      padding-left: 10px;
      transition: transform 0.2s;
      align-self: center;
      flex-shrink: 0;
    }

    .activity-item.expanded .activity-expand-icon {
      transform: rotate(180deg);
    }

    .fireteam-panel {
      display: none;
      grid-column: 1 / -1;
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 12px;
    }

    .activity-item.expanded .fireteam-panel {
      display: block;
    }

    .fireteam-loading {
      font-size: 11px;
      font-family: 'Share Tech Mono', monospace;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0 8px;
    }

    .fireteam-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .fireteam-grid {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fireteam-member {
      display: grid;
      grid-template-columns: 1fr repeat(4, auto);
      gap: 8px 16px;
      align-items: center;
      padding: 6px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 12px;
      font-family: 'Share Tech Mono', monospace;
    }

    .fireteam-member.is-guardian {
      border-color: var(--accent2);
      background: rgba(75, 143, 200, 0.05);
    }

    .member-name {
      color: var(--ghost);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fireteam-member.is-guardian .member-name {
      color: var(--accent2);
    }

    .member-stat {
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .member-stat-val {
      color: var(--text);
      font-weight: 600;
    }

    .member-stat-lbl {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .member-completed {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 1px 6px;
      border: 1px solid;
    }

    .member-completed.ok {
      color: var(--accent2);
      border-color: var(--accent2);
      background: rgba(75, 143, 200, 0.08);
    }

    .member-completed.dnf {
      color: var(--danger);
      border-color: var(--danger);
      background: rgba(200, 75, 75, 0.08);
    }

    .fireteam-error {
      font-size: 11px;
      font-family: 'Share Tech Mono', monospace;
      color: var(--danger);
      padding: 4px 0;
    }

    @media (max-width: 600px) {
      .fireteam-member {
        grid-template-columns: 1fr repeat(3, auto);
      }
      .member-stat:nth-child(4) { display: none; }
    }
  
  </style>
</head>

<body>
  <div class="container">

    <header>
      <svg class="ghost-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="20,4 34,12 34,28 20,36 6,28 6,12" fill="none" stroke="#a8d4ff" stroke-width="1.5" />
        <polygon points="20,10 28,15 28,25 20,30 12,25 12,15" fill="rgba(168,212,255,0.08)" stroke="#4b8fc8"
          stroke-width="1" />
        <circle cx="20" cy="20" r="4" fill="#a8d4ff" opacity="0.9" />
        <circle cx="20" cy="20" r="2" fill="#ffffff" />
      </svg>
      <div class="header-text">
        <h1>Ghost</h1>
        <p>Destiny 2 · Raid &amp; Dungeon History</p>
      </div>
    </header>


<div class="search-section">
      <label class="search-label">Search Guardian</label>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="BungieName or BungieName#1234"
          onkeydown="if(event.key==='Enter') search()" />
        <button id="searchBtn" onclick="search()">Search</button>
      </div>
      <div class="search-hint">Search by name alone or include #code to find an exact match</div>
    </div>

    <div class="status-bar" id="statusBar">
      <div class="spinner" id="statusSpinner" style="display:none"></div>
      <span id="statusText"></span>
    </div>

    <div class="results-list" id="resultsList"></div>

    <div id="profile-section">
      <div class="profile-header">
        <div class="guardian-name" id="guardianName"></div>
        <div class="guardian-code" id="guardianCode"></div>
      </div>

      <div class="section-title">Characters</div>
      <div class="char-tabs" id="charTabs"></div>

      <div class="deco-line"></div>

      <div class="section-title">
        Raid &amp; Dungeon History
        <span class="count" id="activityCount"></span>
      </div>

      <div class="summary-bar" id="summaryBar" style="display:none">
        <div class="summary-stat">
          <div class="summary-val" id="sumTotal">—</div>
          <div class="summary-lbl">Total Runs</div>
        </div>
        <div class="summary-stat">
          <div class="summary-val" id="sumClears">—</div>
          <div class="summary-lbl">Clears</div>
        </div>
        <div class="summary-stat">
          <div class="summary-val" id="sumFirstClears">—</div>
          <div class="summary-lbl">First Clears</div>
        </div>
        <div class="summary-stat">
          <div class="summary-val" id="sumRaids">—</div>
          <div class="summary-lbl">Raid Clears</div>
        </div>
        <div class="summary-stat">
          <div class="summary-val" id="sumDungeons">—</div>
          <div class="summary-lbl">Dungeon Clears</div>
        </div>
      </div>

      <div class="filter-bar" id="filterBar" style="display:none;">
        <label class="filter-toggle" onclick="toggleSoloFilter()">
          <div class="toggle-track" id="soloToggleTrack">
            <div class="toggle-thumb"></div>
          </div>
          Hide solo runs
        </label>
        <button id="downloadBtn" class="secondary" onclick="downloadData()" style="margin-left:auto;">⬇ Download Raw Data</button>
      </div>

      <div class="activity-list" id="activityList">
        <div class="empty-state">
          <div class="icon">◈</div>
          <p>Select a character to view history</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const CLASS_NAMES = { 0: 'Titan', 1: 'Hunter', 2: 'Warlock', 3: 'Unknown' };
    const RACE_NAMES = { 0: 'Human', 1: 'Awoken', 2: 'Exo', 3: 'Unknown' };
    const PLATFORM_NAMES = { 1: 'Xbox', 2: 'PSN', 3: 'Steam', 4: 'Blizzard', 5: 'Stadia', 6: 'Epic', 254: 'BungieNet', 0: 'None' };

    let state = {
      membershipId: '', membershipType: '',
      displayName: '', displayNameCode: '', characters: [], activeCharId: ''
    };

    // Name cache: hash → string
    const nameCache = {};

    // ── API proxy helpers ──────────────────────────────────────────────────────
    // All requests go through the Netlify Function, which injects the API key
    // server-side from the BUNGIE_API_KEY environment variable.

    const PROXY = '/.netlify/functions/bungie-proxy';

    function apiFetch(path) {
      return fetch(`${PROXY}?path=${encodeURIComponent(path)}`).then(r => r.json());
    }

    function apiPost(path, body) {
      return fetch(`${PROXY}?path=${encodeURIComponent(path)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(r => r.json());
    }

    function showStatus(msg, type = 'info', loading = false) {
      const bar = document.getElementById('statusBar');
      bar.className = 'status-bar ' + type;
      document.getElementById('statusText').textContent = msg;
      document.getElementById('statusSpinner').style.display = loading ? 'block' : 'none';
      bar.style.display = 'flex';
    }

    function hideStatus() { document.getElementById('statusBar').style.display = 'none'; }

    // ── Search ──────────────────────────────────────────────────────────────────

    async function search() {
      const raw = document.getElementById('searchInput').value.trim();
      if (!raw) return;

      document.getElementById('resultsList').style.display = 'none';
      document.getElementById('profile-section').style.display = 'none';
      showStatus('Searching for guardian...', 'info', true);

      const hi = raw.lastIndexOf('#');
      const hasCode = hi > 0 && /^\d{1,4}$/.test(raw.slice(hi + 1).trim());

      try {
        // results: array of objects with { membershipId, membershipType,
        //   bungieGlobalDisplayName, bungieGlobalDisplayNameCode, allMemberships? }
        let results = [];

        if (hasCode) {
          // Exact match — one entry per platform the player is on
          const displayName = raw.slice(0, hi);
          const displayNameCode = parseInt(raw.slice(hi + 1)) || 0;
          const data = await apiPost('/Destiny2/SearchDestinyPlayerByBungieName/-1/', { displayName, displayNameCode });
          if (data.ErrorCode !== 1) { showStatus('Error: ' + (data.Message || 'API error'), 'error', false); return; }
          results = data.Response || [];
        } else {
          // Prefix search — one entry per unique Bungie user
          let page = 0;
          while (page < 3) {
            const data = await apiPost(`/User/Search/GlobalName/${page}/`, { displayNamePrefix: raw });
            if (data.ErrorCode !== 1) break;
            const users = data.Response?.searchResults || [];
            for (const u of users) {
              const memberships = u.destinyMemberships || [];
              if (!memberships.length) continue;
              // Prefer the cross-save override membership, else the first one
              const primary = memberships.find(m => m.membershipType === m.crossSaveOverride)
                           || memberships[0];
              results.push({
                ...primary,
                bungieGlobalDisplayName:     u.bungieGlobalDisplayName,
                bungieGlobalDisplayNameCode: u.bungieGlobalDisplayNameCode,
                allMemberships:              memberships,
              });
            }
            if (users.length < 25) break;
            page++;
          }
        }

        if (!results.length) {
          showStatus('No guardians found. Try including the #code for an exact match.', 'error', false);
          return;
        }

        hideStatus();
        // Always show the list so the user can confirm or pick the right account
        renderResultsList(results);
      } catch (e) {
        showStatus('Request failed. Check your connection.', 'error', false);
      }
    }

    function renderResultsList(results) {
      const list = document.getElementById('resultsList');
      list.innerHTML = '';

      results.forEach(r => {
        const item = document.createElement('div');
        item.className = 'result-item';
        const code = r.bungieGlobalDisplayNameCode != null
          ? '#' + String(r.bungieGlobalDisplayNameCode).padStart(4, '0')
          : '';
        const emblemId = `emblem-${r.membershipType}-${r.membershipId}`;

        // Show all platforms this user plays on (cross-save aware)
        const platforms = (r.allMemberships || [r])
          .map(m => PLATFORM_NAMES[m.membershipType] || ('Platform ' + m.membershipType))
          .filter((v, i, a) => a.indexOf(v) === i) // dedupe
          .join(' · ');

        item.innerHTML = `
          <div class="result-emblem" id="${emblemId}">
            <div class="result-emblem-placeholder">◈</div>
            <img alt="emblem" />
          </div>
          <div style="flex:1; min-width:0; padding: 0 12px;">
            <div class="result-name">${r.bungieGlobalDisplayName || r.displayName}<span class="result-code">${code}</span></div>
            <div class="result-platforms">${platforms}</div>
          </div>
        `;
        item.onclick = () => { list.style.display = 'none'; loadProfile(r); };
        list.appendChild(item);
      });

      list.style.display = 'block';

      // Fetch emblems in parallel — update each card as they resolve
      results.forEach(r => {
        const emblemId = `emblem-${r.membershipType}-${r.membershipId}`;
        apiFetch(`/Destiny2/${r.membershipType}/Profile/${r.membershipId}/?components=200`)
          .then(data => {
            if (data.ErrorCode !== 1) return;
            const chars = Object.values(data.Response?.characters?.data || {});
            if (!chars.length) return;
            // Most recently played character
            chars.sort((a, b) => new Date(b.dateLastPlayed) - new Date(a.dateLastPlayed));
            const emblemPath = chars[0].emblemPath;
            if (!emblemPath) return;
            const el = document.getElementById(emblemId);
            if (!el) return;
            const img = el.querySelector('img');
            img.onload = () => img.classList.add('loaded');
            img.src = 'https://www.bungie.net' + emblemPath;
          })
          .catch(() => {}); // silently skip if emblem fetch fails
      });
    }

    // ── Profile ─────────────────────────────────────────────────────────────────

    async function loadProfile(player) {
      showStatus('Loading guardian profile...', 'info', true);
      state.membershipId = player.membershipId;
      state.membershipType = player.membershipType;
      state.displayName = player.bungieGlobalDisplayName || player.displayName;
      state.displayNameCode = player.bungieGlobalDisplayNameCode;

      try {
        const data = await apiFetch(`/Destiny2/${state.membershipType}/Profile/${state.membershipId}/?components=100,200`);
        if (data.ErrorCode !== 1) { showStatus('Error loading profile: ' + (data.Message || 'unknown'), 'error', false); return; }

        const chars = data.Response.characters?.data;
        if (!chars) { showStatus('No characters found on this account.', 'error', false); return; }

        state.characters = Object.values(chars).sort((a, b) => new Date(b.dateLastPlayed) - new Date(a.dateLastPlayed));

        document.getElementById('guardianName').textContent = state.displayName;
        document.getElementById('guardianCode').textContent =
          '#' + String(state.displayNameCode).padStart(4, '0') + ' · ' + (PLATFORM_NAMES[state.membershipType] || '');

        renderCharTabs();
        document.getElementById('profile-section').style.display = 'block';
        hideStatus();

        if (state.characters.length) selectChar(state.characters[0].characterId);
      } catch (e) {
        showStatus('Failed to load profile.', 'error', false);
      }
    }

    function renderCharTabs() {
      const tabs = document.getElementById('charTabs');
      tabs.innerHTML = '';
      state.characters.forEach(c => {
        const cls = CLASS_NAMES[c.classType] || 'Unknown';
        const tab = document.createElement('div');
        tab.className = 'char-tab';
        tab.dataset.charid = c.characterId;
        tab.innerHTML = `
      <div class="char-class ${cls.toLowerCase()}">${cls}</div>
      <div class="char-light">${c.light}</div>
      <div class="char-race">${RACE_NAMES[c.raceType] || ''}</div>
    `;
        tab.onclick = () => selectChar(c.characterId);
        tabs.appendChild(tab);
      });
    }

    function selectChar(charId) {
      state.activeCharId = charId;
      document.querySelectorAll('.char-tab').forEach(t => t.classList.toggle('active', t.dataset.charid === charId));
      loadAllHistory();
    }

    // ── Fetch all raids + dungeons ───────────────────────────────────────────────

    async function fetchAllPages(mode, label) {
      const all = [];
      let page = 0;
      while (true) {
        showStatus(`Scanning ${label}... (page ${page + 1})`, 'info', true);
        const data = await apiFetch(
          `/Destiny2/${state.membershipType}/Account/${state.membershipId}/Character/${state.activeCharId}/Stats/Activities/` +
          `?count=100&mode=${mode}&page=${page}`
        );
        if (data.ErrorCode !== 1) break;
        const acts = data.Response?.activities || [];
        all.push(...acts);
        if (acts.length < 100) break;
        page++;
        if (page > 49) break; // safety cap at 5000 per mode
      }
      return all;
    }

    async function resolveNames(hashes) {
      // Fetch in batches of 8 (parallel within each batch)
      for (let i = 0; i < hashes.length; i += 8) {
        const batch = hashes.slice(i, i + 8).filter(h => !nameCache[h]);
        if (!batch.length) continue;
        showStatus(`Resolving activity names (${i + batch.length} / ${hashes.length})...`, 'info', true);
        await Promise.all(batch.map(async hash => {
          try {
            const data = await apiFetch(`/Destiny2/Manifest/DestinyActivityDefinition/${hash}/`);
            nameCache[hash] = (data.ErrorCode === 1)
              ? (data.Response?.displayProperties?.name || 'Unknown Activity')
              : 'Unknown Activity';
          } catch { nameCache[hash] = 'Unknown Activity'; }
        }));
      }
    }


    async function loadAllHistory() {
      document.getElementById('activityList').innerHTML =
        '<div class="empty-state"><div class="spinner" style="margin:0 auto 16px;width:24px;height:24px;border-width:2px"></div><p>Scanning history...</p></div>';
      document.getElementById('summaryBar').style.display = 'none';
      document.getElementById('filterBar').style.display = 'none';
      document.getElementById('activityCount').textContent = '';

      try {
        // Fetch raids and dungeons sequentially (so progress messages make sense)
        const raids = await fetchAllPages(4, 'raids');
        const dungeons = await fetchAllPages(82, 'dungeons');

        // Combine and sort oldest → newest
        const all = [...raids, ...dungeons].sort((a, b) => new Date(a.period) - new Date(b.period));

        if (!all.length) {
          hideStatus();
          document.getElementById('activityList').innerHTML =
            '<div class="empty-state"><div class="icon">◈</div><p>No raids or dungeons found for this character</p></div>';
          return;
        }

        // Resolve unique activity names
        const uniqueHashes = [...new Set(all.map(a => a.activityDetails.referenceId))];
        await resolveNames(uniqueHashes);

        // Store raw data for download / debugging
        state.rawActivities = all;
        state.rawNameCache = { ...nameCache };

        // Determine first clears: walk chronologically, mark first completed run per activity name.
        // We use the resolved name rather than directorActivityHash because Bungie sometimes
        // creates new activity definitions for the same raid (e.g. after patches), resulting
        // in different hashes that resolve to the same name.
        const firstClearInstances = new Set();
        const seenCleared = new Set();

        all.forEach(act => {
          const name = nameCache[act.activityDetails.referenceId] || ('hash:' + act.activityDetails.directorActivityHash);
          const completed = (act.values?.completed?.basic?.value ?? 0) === 1;
          if (completed && !seenCleared.has(name)) {
            firstClearInstances.add(act.activityDetails.instanceId);
            seenCleared.add(name);
          }
        });

        // Build raid set for type-badge
        const raidInstanceIds = new Set(raids.map(r => r.activityDetails.instanceId));

        hideStatus();
        renderActivities(all, firstClearInstances, raidInstanceIds);
      } catch (e) {
        showStatus('Failed to load history. Check your API key.', 'error', false);
      }
    }

    // ── Solo filter ──────────────────────────────────────────────────────────────

    let hideSolo = false;

    function toggleSoloFilter() {
      hideSolo = !hideSolo;
      const track = document.getElementById('soloToggleTrack');
      track.classList.toggle('on', hideSolo);
      if (state.renderedActivities) {
        renderActivities(
          state.renderedActivities,
          state.renderedFirstClears,
          state.renderedRaidIds
        );
      }
    }

    // ── Fireteam expand ───────────────────────────────────────────────────────────

    // Cache fetched fireteam data: instanceId → array of player entries
    const fireteamCache = {};

    async function toggleActivity(item, instanceId) {
      const isExpanded = item.classList.contains('expanded');
      // Collapse any other open item
      document.querySelectorAll('.activity-item.expanded').forEach(el => el.classList.remove('expanded'));
      if (isExpanded) return; // was open — just close it

      item.classList.add('expanded');
      const panel = item.querySelector('.fireteam-panel');

      if (fireteamCache[instanceId] !== undefined) {
        renderFireteam(panel, fireteamCache[instanceId]);
        return;
      }

      panel.innerHTML = '<div class="fireteam-loading"><div class="spinner"></div>Loading fireteam...</div>';

      try {
        const data = await apiFetch(`/Destiny2/Stats/PostGameCarnageReport/${instanceId}/`);
        if (data.ErrorCode !== 1) throw new Error(data.Message || 'API error');
        const entries = data.Response?.entries || [];
        fireteamCache[instanceId] = entries;
        renderFireteam(panel, entries);
      } catch (e) {
        panel.innerHTML = `<div class="fireteam-error">Failed to load fireteam: ${e.message}</div>`;
        fireteamCache[instanceId] = [];
      }
    }

    function renderFireteam(panel, entries) {
      if (!entries.length) {
        panel.innerHTML = '<div class="fireteam-error">No fireteam data available.</div>';
        return;
      }

      const sorted = [...entries].sort((a, b) => {
        const aIsMe = a.player?.destinyUserInfo?.membershipId === state.membershipId;
        const bIsMe = b.player?.destinyUserInfo?.membershipId === state.membershipId;
        if (aIsMe) return -1;
        if (bIsMe) return 1;
        return (b.score?.basic?.value || 0) - (a.score?.basic?.value || 0);
      });

      const rows = sorted.map(function(e) {
        const info   = e.player && e.player.destinyUserInfo ? e.player.destinyUserInfo : {};
        const vals   = e.values || {};
        const isMe   = info.membershipId === state.membershipId;
        const name   = (info.bungieGlobalDisplayName || info.displayName || 'Unknown') +
                       (info.bungieGlobalDisplayNameCode
                         ? '#' + String(info.bungieGlobalDisplayNameCode).padStart(4, '0')
                         : '');
        const kills  = Math.round((vals.kills  && vals.kills.basic  && vals.kills.basic.value)  || 0);
        const deaths = Math.round((vals.deaths && vals.deaths.basic && vals.deaths.basic.value) || 0);
        const kd     = deaths > 0 ? (kills / deaths).toFixed(2) : kills > 0 ? '\u221e' : '\u2014';
        const done   = ((vals.completed && vals.completed.basic && vals.completed.basic.value) || 0) === 1;
        return '<div class="fireteam-member' + (isMe ? ' is-guardian' : '') + '">' +
               '<div class="member-name">' + name + (isMe ? ' \u25c4' : '') + '</div>' +
               '<div class="member-stat"><div class="member-stat-val">' + kills + '</div><div class="member-stat-lbl">Kills</div></div>' +
               '<div class="member-stat"><div class="member-stat-val">' + deaths + '</div><div class="member-stat-lbl">Deaths</div></div>' +
               '<div class="member-stat"><div class="member-stat-val">' + kd + '</div><div class="member-stat-lbl">K/D</div></div>' +
               '<div class="member-completed ' + (done ? 'ok' : 'dnf') + '">' + (done ? 'Cleared' : 'DNF') + '</div>' +
               '</div>';
      });

      panel.innerHTML =
        '<div class="fireteam-label">Fireteam \u00b7 ' + entries.length + ' guardian' + (entries.length !== 1 ? 's' : '') + '</div>' +
        '<div class="fireteam-grid">' + rows.join('') + '</div>';
    }

        // ── Download ─────────────────────────────────────────────────────────────────

    function downloadData() {
      if (!state.rawActivities) return;

      const firstClearInstances = new Set();
      const seenCleared = new Set();
      [...state.rawActivities].forEach(act => {
        const hash = act.activityDetails.directorActivityHash;
        const completed = (act.values?.completed?.basic?.value ?? 0) === 1;
        if (completed && !seenCleared.has(hash)) {
          firstClearInstances.add(act.activityDetails.instanceId);
          seenCleared.add(hash);
        }
      });

      const annotated = state.rawActivities.map(act => ({
        instanceId:            act.activityDetails.instanceId,
        referenceId:           act.activityDetails.referenceId,
        directorActivityHash:  act.activityDetails.directorActivityHash,
        activityName:          state.rawNameCache[act.activityDetails.referenceId] || 'Unknown',
        period:                act.period,
        completed:             (act.values?.completed?.basic?.value ?? 0) === 1,
        markedAsFirstClear:    firstClearInstances.has(act.activityDetails.instanceId),
        durationSeconds:       act.values?.activityDurationSeconds?.basic?.value || 0,
        kills:                 act.values?.kills?.basic?.value || 0,
        deaths:                act.values?.deaths?.basic?.value || 0,
        raw:                   act,
      }));

      const payload = {
        exportedAt:   new Date().toISOString(),
        guardian:     state.displayName + '#' + String(state.displayNameCode).padStart(4, '0'),
        membershipId: state.membershipId,
        characterId:  state.activeCharId,
        totalRuns:    annotated.length,
        activities:   annotated,
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `ghost-${state.displayName}-${state.activeCharId}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ── Render ───────────────────────────────────────────────────────────────────

    function renderActivities(activities, firstClearInstances, raidInstanceIds) {
      // Persist for re-render when filter toggles
      state.renderedActivities  = activities;
      state.renderedFirstClears = firstClearInstances;
      state.renderedRaidIds     = raidInstanceIds;

      // Apply solo filter
      const filtered = hideSolo
        ? activities.filter(act => {
            const playerCount = act.values && act.values.playerCount
              ? act.values.playerCount.basic.value
              : 1;
            // This value changes the fireteam minimum size to be excluded in "solo" toggle.
            return playerCount >= 1;
          })
        : activities;

      const list = document.getElementById('activityList');
      list.innerHTML = '';

      let totalClears = 0, totalFirstClears = 0, raidClears = 0, dungeonClears = 0;

      filtered.forEach((act, i) => {
        const v = act.values || {};
        const details = act.activityDetails || {};
        const refHash = details.referenceId;
        const instId = details.instanceId;
        const isRaid = raidInstanceIds.has(instId);
        const name = nameCache[refHash] || 'Unknown Activity';

        const completed = (v.completed?.basic?.value ?? 0) === 1;
        const isFirstClr = firstClearInstances.has(instId);
        const duration = formatDuration(v.activityDurationSeconds?.basic?.value || 0);

        const period = new Date(act.period);
        const dateStr = period.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        const timeStr = period.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

        const kills = Math.round(v.kills?.basic?.value || 0);
        const deaths = Math.round(v.deaths?.basic?.value || 0);
        const kd = deaths > 0 ? (kills / deaths).toFixed(2) : kills > 0 ? '∞' : '—';

        // Tally stats
        if (completed) {
          totalClears++;
          if (isRaid) raidClears++; else dungeonClears++;
        }
        if (isFirstClr) totalFirstClears++;

        const resultClass = completed ? 'ok' : 'dnf';
        const resultLabel = completed ? 'Cleared' : 'DNF';

        const itemClass = [
          'activity-item',
          completed ? 'completed' : 'dnf',
          isFirstClr ? 'first-clear' : ''
        ].join(' ').trim();

        const item = document.createElement('div');
        item.className = itemClass;
        item.style.animationDelay = Math.min(i * 0.015, 0.5) + 's';

        item.innerHTML = `
      <div class="act-main">
        <div class="act-name-row">
          <div class="act-name">${name}</div>
          <div class="act-type-badge ${isRaid ? 'raid' : 'dungeon'}">${isRaid ? 'Raid' : 'Dungeon'}</div>
          ${isFirstClr ? '<div class="first-clear-badge">First Clear</div>' : ''}
        </div>
        <div class="act-meta">
          <span>${dateStr} · ${timeStr}</span>
          <span>⏱ ${duration}</span>
        </div>
      </div>
      <div class="act-stats">
        <div class="stat-item">
          <div class="stat-val">${kills}</div>
          <div class="stat-lbl">Kills</div>
        </div>
        <div class="stat-item">
          <div class="stat-val">${deaths}</div>
          <div class="stat-lbl">Deaths</div>
        </div>
        <div class="stat-item">
          <div class="stat-val">${kd}</div>
          <div class="stat-lbl">K/D</div>
        </div>
        <div class="act-result ${resultClass}">${resultLabel}</div>
        <div class="activity-expand-icon">▼</div>
      </div>
      <div class="fireteam-panel"></div>
    `;

        item.onclick = () => toggleActivity(item, instId);
        list.appendChild(item);
      });

      // Update section title count
      document.getElementById('activityCount').textContent = `${filtered.length} runs`;

      // Update summary bar
      document.getElementById('sumTotal').textContent = filtered.length;
      document.getElementById('sumClears').textContent = totalClears;
      document.getElementById('sumFirstClears').textContent = totalFirstClears;
      document.getElementById('sumRaids').textContent = raidClears;
      document.getElementById('sumDungeons').textContent = dungeonClears;
      document.getElementById('summaryBar').style.display = 'flex';
      document.getElementById('filterBar').style.display = 'flex';
    }

    function formatDuration(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      if (m >= 60) { const h = Math.floor(m / 60); return `${h}h ${m % 60}m`; }
      return `${m}m ${String(s).padStart(2, '0')}s`;
    }
  </script>
</body>

</html>
